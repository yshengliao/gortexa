version: v2
modules:
  - path: proto
deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    # Google-style resource RPCs return the resource (or Empty) directly rather
    # than a dedicated <Method>Response message; these two rules conflict with
    # that idiom, exactly as googleapis itself disables them.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  # One-time v0.27 vendor-prefix move: ai/v1 was deleted in favour of
  # gortexa/ai/v1 (wire-compatible: extension numbers unchanged). Ignoring the
  # OLD path suppresses only the deletion; message-level breaks in the new
  # gortexa/ai/v1 file are still gated. (buf's FILE rules do not catch an
  # extension *renumber* — that wire-compat invariant is pinned by a golden
  # test in mcp instead.) Drop the entry once a release containing gortexa/ai
  # is the comparison base.
  ignore:
    - proto/ai
  use:
    - FILE
