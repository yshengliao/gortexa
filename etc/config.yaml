# Gortexa sample config (development defaults). Override per-environment via
# GORTEXA_* env vars (e.g. GORTEXA_AUTH__JWT_SECRET) — never commit real secrets.
server:
  addr: ":8080"
  shutdown_timeout: 20s
  enable_cors: true
  openapi: true
  # reflection exposes the full service schema over the shared gRPC/HTTP/MCP
  # port (grpc.reflection.v1); intended for dev tooling (e.g. `buf curl --reflect`).
  reflection: false

auth:
  # Placeholder only. The server REFUSES to start with this exact value, so set a
  # real secret via GORTEXA_AUTH__JWT_SECRET (>= 32 bytes). `gortexa create`
  # replaces it with a fresh random secret; `make run` injects a local dev one.
  jwt_secret: "dev-only-insecure-secret-change-me-please"
  issuer: "gortexa"
  # audience: "myapp"  # optional; isolates services sharing a secret+issuer (aud claim required when set)
  ttl: 1h

cache:
  # driver "memory" (default) is a process-local in-memory cache — no external
  # service, so the app runs without Redis. It is per-instance (not shared
  # across replicas); use "redis" for a distributed cache. addr/password/db and
  # the *_timeout / pool_size tunables apply only to the redis driver.
  driver: "memory"
  # addr: "localhost:6379"

mq:
  # driver "nats" (default) is core NATS: at-most-once, no redelivery.
  # "jetstream" is durable at-least-once — a handler error is redelivered, so
  # handlers must be idempotent. Both need a NATS server (jetstream needs it
  # started with -js).
  driver: "nats"
  # url accepts a comma-separated server list, e.g. "nats://a:4222,nats://b:4222".
  # Empty falls back to the NATS default URL.
  url: ""
  # group_id selects delivery semantics: empty (default) fans out — every
  # subscription receives every message; non-empty load-balances —
  # subscriptions sharing the group split the stream (NATS queue group /
  # durable JetStream consumer).
  group_id: ""

log:
  level: "info"
  format: "json"

observ:
  service_name: "gortexa"
  # tracing_otlp: "localhost:4317"   # uncomment to export OTLP traces
  # otlp_insecure exports telemetry over cleartext gRPC. TLS is the default;
  # this is true here only for the local docker-compose collector. Do NOT set
  # true against a remote collector — GenAI-captured content would go in clear.
  otlp_insecure: true
  sample_ratio: 1.0
