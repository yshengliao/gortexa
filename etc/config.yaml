# Gortexa sample config (development defaults). Override per-environment via
# GORTEXA_* env vars (e.g. GORTEXA_AUTH__JWT_SECRET) — never commit real secrets.
server:
  addr: ":8080"
  shutdown_timeout: 20s
  enable_cors: true
  openapi: true
  # reflection exposes the full service schema over the shared gRPC/HTTP/MCP
  # port (grpc.reflection.v1); intended for dev tooling (e.g. `buf curl --reflect`).
  reflection: false

auth:
  # Placeholder only. The server REFUSES to start with this exact value, so set a
  # real secret via GORTEXA_AUTH__JWT_SECRET (>= 32 bytes). `gortexa create`
  # replaces it with a fresh random secret; `make run` injects a local dev one.
  jwt_secret: "dev-only-insecure-secret-change-me-please"
  issuer: "gortexa"
  ttl: 1h

log:
  level: "info"
  format: "json"

observ:
  service_name: "gortexa"
  # tracing_otlp: "localhost:4317"   # uncomment to export OTLP traces
  # otlp_insecure exports telemetry over cleartext gRPC. TLS is the default;
  # this is true here only for the local docker-compose collector. Do NOT set
  # true against a remote collector — GenAI-captured content would go in clear.
  otlp_insecure: true
  sample_ratio: 1.0
