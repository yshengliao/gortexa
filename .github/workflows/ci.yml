name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # KRaft single-node broker for `make test-integration`. Env mirrors
      # deploy/docker-compose.yaml's kafka service; ADVERTISED_LISTENERS points
      # at 127.0.0.1 (not the "kafka" compose hostname) since the runner talks
      # to the service container over localhost.
      kafka:
        image: bitnami/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: "0"
          KAFKA_CFG_PROCESS_ROLES: "controller,broker"
          KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@127.0.0.1:9093"
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          ALLOW_PLAINTEXT_LISTENER: "yes"
        options: >-
          --health-cmd "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Put go-installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (buf + plugins + sqlc + govulncheck + golangci-lint)
        run: |
          make bootstrap
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: Generate (buf lint + generate)
        run: make gen

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test (race)
        run: make test

      - name: Test (integration)
        run: make test-integration
        env:
          KAFKA_BROKER: 127.0.0.1:9092

      - name: Lint
        run: make lint
