name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  ci:
    runs-on: ubuntu-latest
    # The job only reads the repository; nothing here writes to it.
    permissions:
      contents: read
    services:
      # Real Redis for the opt-in cache backend's integration test (the default
      # cache backend is in-memory and needs no service). Matches
      # deploy/docker-compose.yaml.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Postgres + PgBouncer (deploy compose)
        run: |
          docker compose -f deploy/docker-compose.yaml up -d postgres pgbouncer
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/6432) 2>/dev/null && exit 0; sleep 1
          done
          echo "pgbouncer not ready" >&2
          docker compose -f deploy/docker-compose.yaml logs pgbouncer
          exit 1

      - name: Put go-installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (buf + plugins + sqlc + govulncheck + golangci-lint)
        run: |
          make bootstrap
          # Pinned to the same ref as the binary: HEAD is the installer's default
          # branch, so piping it to sh ran whatever landed there upstream, in a
          # runner holding this checkout and a GITHUB_TOKEN.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.0/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.0

      # Tolerant: a repo without a main branch (e.g. a scaffold pushed with a
      # different default) skips the fetch and the Makefile gate falls back.
      - name: Fetch origin/main for the buf breaking gate
        run: git fetch --no-tags --depth=1 origin main || echo "no origin/main — buf breaking gate will be skipped"

      - name: Generate (buf lint + generate)
        run: make gen

      # git diff alone cannot fail on NEW untracked files under gen/, so a
      # forgotten `git add` of a fresh package would ship a tag consumers
      # cannot build. porcelain covers modified, deleted and untracked alike.
      # Both trees are checked: the pathspec `gen` matches only the top-level
      # directory, and api/gen holds the annotations bindings the api module
      # publishes — drift there ships stale bindings to every scaffolded project.
      - name: Committed gen/ and api/gen/ trees must not drift from proto
        run: |
          git status --porcelain -- gen api/gen
          test -z "$(git status --porcelain -- gen api/gen)"

      # The api module is a separate go.mod, so the root `./...` targets below
      # never compile or vet it on its own — only as a dependency through the
      # local replace, which a consumer does not have.
      - name: Build api module
        run: |
          go -C api build ./...
          go -C api vet ./...

      # Consumers never see the local replace: they resolve the api module from
      # the version go.mod requires. Build once the way they do, so a change
      # under api/ that was not re-tagged and re-required fails here instead of
      # shipping a framework that depends on bindings nobody can resolve.
      - name: Build without the api replace (consumer view)
        run: |
          tmp=$(mktemp -d)
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp"
          go mod edit -dropreplace=github.com/yshengliao/gortexa/api
          GOFLAGS=-mod=mod go build ./...

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test (race)
        run: make test

      - name: Test (integration)
        run: make test-integration
        env:
          # Forces the storage integration test (fail instead of skip) against
          # the compose-provided PgBouncer started in the step above.
          PGBOUNCER_DSN: postgres://postgres@127.0.0.1:6432/gortexa?sslmode=disable

      - name: Lint
        run: make lint

      - name: Vulnerability scan
        run: make vuln
