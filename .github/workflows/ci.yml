name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Real Redis for the opt-in cache backend's integration test (the default
      # cache backend is in-memory and needs no service). Matches
      # deploy/docker-compose.yaml.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Postgres + PgBouncer (deploy compose)
        run: |
          docker compose -f deploy/docker-compose.yaml up -d postgres pgbouncer
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/6432) 2>/dev/null && exit 0; sleep 1
          done
          echo "pgbouncer not ready" >&2
          docker compose -f deploy/docker-compose.yaml logs pgbouncer
          exit 1

      - name: Put go-installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (buf + plugins + sqlc + govulncheck + golangci-lint)
        run: |
          make bootstrap
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      # Tolerant: a repo without a main branch (e.g. a scaffold pushed with a
      # different default) skips the fetch and the Makefile gate falls back.
      - name: Fetch origin/main for the buf breaking gate
        run: git fetch --no-tags --depth=1 origin main || echo "no origin/main — buf breaking gate will be skipped"

      - name: Generate (buf lint + generate)
        run: make gen

      # git diff alone cannot fail on NEW untracked files under gen/, so a
      # forgotten `git add` of a fresh package would ship a tag consumers
      # cannot build. porcelain covers modified, deleted and untracked alike.
      - name: Committed gen/ tree must not drift from proto
        run: |
          git status --porcelain -- gen
          test -z "$(git status --porcelain -- gen)"

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test (race)
        run: make test

      - name: Test (integration)
        run: make test-integration
        env:
          # Forces the storage integration test (fail instead of skip) against
          # the compose-provided PgBouncer started in the step above.
          PGBOUNCER_DSN: postgres://postgres@127.0.0.1:6432/gortexa?sslmode=disable

      - name: Lint
        run: make lint

      - name: Vulnerability scan
        run: make vuln
