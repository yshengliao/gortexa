name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # KRaft single-node broker for `make test-integration`, matching
      # deploy/docker-compose.yaml. apache/kafka's default config advertises
      # PLAINTEXT://localhost:9092, which the runner reaches through the port
      # mapping — no env needed (setting any KAFKA_* env would replace the
      # image's entire default config). Pinned: the health-cmd assumes the
      # /opt/kafka/bin layout, which a floating :latest could move. Bump the
      # tag here and in deploy/docker-compose.yaml together.
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
      # Real Redis for the opt-in cache backend's integration test (the default
      # cache backend is in-memory and needs no service). Matches
      # deploy/docker-compose.yaml.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Put go-installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (buf + plugins + sqlc + govulncheck + golangci-lint)
        run: |
          make bootstrap
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: Generate (buf lint + generate)
        run: make gen

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test (race)
        run: make test

      - name: Test (integration)
        run: make test-integration
        env:
          KAFKA_BROKER: 127.0.0.1:9092

      - name: Lint
        run: make lint

      - name: Vulnerability scan
        run: make vuln
