name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Put go-installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (buf + plugins + sqlc + govulncheck + golangci-lint)
        run: |
          make bootstrap
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: Generate (buf lint + generate)
        run: make gen

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test (race)
        run: make test

      - name: Lint
        run: make lint
