groups:
  - name: gortexa.slo
    rules:
      # otelgrpc's StatsHandler (v0.71, default stable RPC semconv) records
      # rpc.server.call.duration in seconds with rpc.response.status_code set
      # to the canonical code name; the collector's Prometheus exporter turns
      # that into the series below.
      - alert: ErrorBudgetFastBurn
        expr: |
          sum(rate(rpc_server_call_duration_seconds_count{rpc_response_status_code!="OK"}[1h])) /
          sum(rate(rpc_server_call_duration_seconds_count[1h])) > 14.4 * 0.001
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Fast burn: error budget consumed 14.4x in 1h window"
      - alert: LoadSheddingSpike
        expr: increase(gortexa_load_shed_total[5m]) > 50
        for: 1m
        labels: {severity: warning}
      - alert: CircuitBreakerOpen
        expr: increase(gortexa_cb_state_changes_total{to="open"}[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Circuit breaker opened on {{ $labels.method }}"
      - alert: HighAuthDenialRate
        expr: rate(gortexa_auth_denied_total[5m]) > 10
        for: 2m
        labels: {severity: warning}
