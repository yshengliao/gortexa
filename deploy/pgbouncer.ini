; PgBouncer in transaction-pooling mode. Gortexa's pgx pool is configured for
; this (QueryExecModeExec, no server-side named prepared statements) — see
; internal/storage/storage.go.
[databases]
gortexa = host=postgres port=5432 dbname=gortexa

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; trust still requires the user to exist in auth_file — without it every
; connection fails with "trust authentication failed".
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
