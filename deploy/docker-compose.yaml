# Backing services for `make test-integration` (real PgBouncer / Redis / NATS).
# The default `make test` needs none of these — it uses in-process fakes.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gortexa
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on: [postgres]
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["6432:6432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  nats:
    image: nats:2
    # -js enables JetStream so the durable MQ driver (mq.driver: jetstream)
    # works against this stack; core NATS behaviour is unaffected.
    command: ["-js"]
    ports: ["4222:4222"]

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on: [jaeger, prometheus]

  jaeger:
    image: jaegertracing/jaeger:2
    ports:
      - "16686:16686"
    environment:
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
