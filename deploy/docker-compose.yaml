# Backing services for `make test-integration` (real PgBouncer / Redis / NATS /
# Kafka). The default `make test` needs none of these — it uses in-process fakes.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gortexa
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on: [postgres]
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports: ["6432:6432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  nats:
    image: nats:2
    ports: ["4222:4222"]

  kafka:
    image: bitnami/kafka:latest
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    ports: ["9092:9092"]
