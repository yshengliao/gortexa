version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: gen
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
  - local: protoc-gen-openapiv2
    out: gen/openapiv2
    # strategy: all passes every proto to a single plugin invocation. Under buf's
    # default per-directory strategy, allow_merge only ever sees one directory's
    # files, so the merged swagger drops every other service's paths.
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=gortexa
